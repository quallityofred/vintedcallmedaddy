<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Vinted Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: '#060b06',
                        surface: '#0e180e',
                        border: '#1a2f1a',
                        primary: '#256325',
                        accent: '#4ade80',
                        'accent-dim': '#3b7a3b',
                        text: '#e8ede8',
                        muted: '#8a9e8a',
                        error: '#ef4444',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
        body { background: #060b06; color: #e8ede8; }
        input {
            background: rgba(0,0,0,0.3) !important;
            border: 1px solid rgba(74, 222, 128, 0.12) !important;
            color: #e8ede8 !important;
            border-radius: 10px !important;
            transition: all 0.2s ease;
        }
        input:focus {
            border-color: #4ade80 !important;
            box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.1) !important;
            outline: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #256325 0%, #1f7a1f 100%);
            color: #fff;
            border: 1px solid rgba(74, 222, 128, 0.2);
            transition: all 0.25s ease;
            border-radius: 10px;
            font-weight: 500;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #2d7a2d 0%, #258a25 100%);
            box-shadow: 0 4px 20px rgba(74, 222, 128, 0.2);
            transform: translateY(-1px);
        }
        .card {
            background: linear-gradient(135deg, rgba(14, 24, 14, 0.9) 0%, rgba(10, 20, 10, 0.95) 100%);
            border: 1px solid rgba(74, 222, 128, 0.08);
            border-radius: 16px;
            backdrop-filter: blur(20px);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in { animation: fadeIn 0.4s ease forwards; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="animate-in w-full max-w-md">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-[rgba(74,222,128,0.1)] mb-4">
                <i data-lucide="scan-search" class="w-7 h-7 text-accent"></i>
            </div>
            <h1 class="text-2xl font-bold text-text">Vinted Monitor</h1>
            <p class="text-muted text-sm mt-1">войдите в аккаунт</p>
        </div>

        <div class="card p-6">
            {% if error %}
            <div class="mb-4 p-3 rounded-xl bg-[rgba(239,68,68,0.1)] border border-[rgba(239,68,68,0.2)] text-error text-sm flex items-center gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="post" action="/login" class="space-y-4">
                <div>
                    <label class="flex items-center gap-2 text-xs font-medium text-muted mb-1.5">
                        <i data-lucide="user" class="w-3 h-3"></i> Имя пользователя
                    </label>
                    <input type="text" name="username" required autofocus
                        class="w-full px-4 py-2.5" placeholder="username">
                </div>
                <div>
                    <label class="flex items-center gap-2 text-xs font-medium text-muted mb-1.5">
                        <i data-lucide="lock" class="w-3 h-3"></i> Пароль
                    </label>
                    <input type="password" name="password" required
                        class="w-full px-4 py-2.5" placeholder="********">
                </div>
                <button type="submit" class="btn-primary w-full px-6 py-2.5 inline-flex items-center justify-center gap-2 text-sm mt-2">
                    <i data-lucide="log-in" class="w-4 h-4"></i>
                    <span>Войти</span>
                </button>
            </form>

            <p class="text-center text-muted text-sm mt-5">
                Нет аккаунта? <a href="/register" class="text-accent hover:underline font-medium">Зарегистрироваться</a>
            </p>
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
