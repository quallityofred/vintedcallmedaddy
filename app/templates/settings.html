{% extends "base.html" %}
{% block content %}
<div class="animate-in max-w-2xl">
    <div class="flex items-center gap-3 mb-8">
        <div class="icon-badge bg-[rgba(74,222,128,0.1)]">
            <i data-lucide="settings-2" class="w-5 h-5 text-accent"></i>
        </div>
        <div>
            <h1 class="text-2xl font-bold text-text">Настройки</h1>
            <p class="text-muted text-sm">конфигурация системы</p>
        </div>
    </div>

    <div class="card p-6">
        <form method="post" action="/settings" class="space-y-8">
            <div class="pb-6 border-b border-[rgba(74,222,128,0.06)]">
                <div class="flex items-center gap-2 mb-5">
                    <i data-lucide="send" class="w-4 h-4 text-accent"></i>
                    <h2 class="text-sm font-semibold text-text uppercase tracking-wider">Telegram</h2>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="flex items-center gap-2 text-xs font-medium text-muted mb-1.5">
                            <i data-lucide="key" class="w-3 h-3"></i> Bot Token
                        </label>
                        <input type="password" name="telegram_token"
                            value="{{ settings.get('telegram_bot_token', '') }}"
                            class="w-full px-4 py-2.5" placeholder="123456:ABC-DEF...">
                    </div>
                    <div>
                        <label class="flex items-center gap-2 text-xs font-medium text-muted mb-1.5">
                            <i data-lucide="hash" class="w-3 h-3"></i> Chat ID
                        </label>
                        <input type="text" name="telegram_chat_id"
                            value="{{ settings.get('telegram_chat_id', '') }}"
                            class="w-full px-4 py-2.5" placeholder="123456789">
                    </div>
                </div>
            </div>

            <div class="pb-6 border-b border-[rgba(74,222,128,0.06)]">
                <div class="flex items-center gap-2 mb-5">
                    <i data-lucide="shield" class="w-4 h-4 text-accent"></i>
                    <h2 class="text-sm font-semibold text-text uppercase tracking-wider">Прокси</h2>
                </div>
                <div>
                    <label class="flex items-center gap-2 text-xs font-medium text-muted mb-1.5">
                        <i data-lucide="list" class="w-3 h-3"></i> Список (по одному на строку)
                    </label>
                    <textarea name="proxies" rows="4"
                        class="w-full px-4 py-2.5 font-mono text-xs"
                        placeholder="http://user:pass@proxy1:8080&#10;http://user:pass@proxy2:8080"
                    >{{ settings.get('proxies', '') }}</textarea>
                </div>
            </div>

            <div>
                <div class="flex items-center gap-2 mb-5">
                    <i data-lucide="gauge" class="w-4 h-4 text-accent"></i>
                    <h2 class="text-sm font-semibold text-text uppercase tracking-wider">Параметры парсинга</h2>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="flex items-center gap-2 text-xs font-medium text-muted mb-1.5">
                            <i data-lucide="layers" class="w-3 h-3"></i> Сессий на домен
                        </label>
                        <input type="number" name="sessions_per_domain"
                            value="{{ settings.get('sessions_per_domain', '3') }}"
                            min="1" max="10" class="w-full px-4 py-2.5">
                    </div>
                    <div>
                        <label class="flex items-center gap-2 text-xs font-medium text-muted mb-1.5">
                            <i data-lucide="activity" class="w-3 h-3"></i> Rate limit
                        </label>
                        <input type="number" name="rate_limit_per_minute"
                            value="{{ settings.get('rate_limit_per_minute', '8') }}"
                            min="1" max="30" class="w-full px-4 py-2.5">
                        <p class="text-muted text-[10px] mt-1">запросов в минуту</p>
                    </div>
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" class="btn-primary px-6 py-2.5 inline-flex items-center gap-2 text-sm">
                    <i data-lucide="save" class="w-4 h-4"></i>
                    <span>Сохранить настройки</span>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
